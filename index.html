<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Üstün Deneme Kulübü</title>
  <link rel="icon" type="image/png" href="favicon.png" />

  <style>
    body {
      margin: 0;
      font-family: "Arial", sans-serif;
      background: #0f172a;
      color: #ffffff;
    }

    /* 🔝 ÜST MENÜ */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: #020617;
    }

    header img {
      height: 55px;
    }

    nav a {
      color: #e5e7eb;
      text-decoration: none;
      margin-left: 25px;
      font-size: 16px;
      transition: 0.3s;
    }

    nav a:hover {
      color: #facc15;
    }

    /* 🎯 ANA ALAN */
    .hero {
      min-height: calc(100vh - 140px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
    }

    .hero img {
      max-width: 320px;
      margin-bottom: 30px;
    }

    .hero h1 {
      font-size: clamp(26px, 5vw, 48px);
      margin-bottom: 20px;
    }

    .hero p {
      font-size: clamp(15px, 2.5vw, 20px);
      max-width: 700px;
      color: #cbd5f5;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    /* 🔘 BUTON */
    .button {
      background: #facc15;
      color: #020617;
      padding: 16px 40px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      transition: 0.3s;
    }

    .button:hover {
      background: #eab308;
      transform: scale(1.05);
    }

    /* 🔻 FOOTER */
    footer {
      background: #020617;
      text-align: center;
      padding: 20px;
      font-size: 14px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

<header>
  <img src="logo.png" alt="Üstün Deneme Kulübü">
  <nav>
    <a href="#">Anasayfa</a>
    <a href="#">Denemeler</a>
    <a href="#">Hakkımızda</a>
    <a href="#">İletişim</a>
  </nav>
</header>

<section class="hero">
  <img src="logo.png" alt="Üstün Deneme Kulübü Logo">

  <h1>8. Sınıf Online Deneme Kulübü</h1>

  <p>
    8. sınıf matematik denemeleri için yapılandırılmış,  
    analiz ve gelişim odaklı dijital deneme ortamı.
  </p>

  <a href="deneme-alani.html" class="button">
    Deneme Alanına Giriş
  </a>
</section>

<footer>
  Bu platform pilot uygulama kapsamındadır.  
  İçerikler ve sistem sürekli geliştirilmektedir.
</footer>

</body>
</html>
