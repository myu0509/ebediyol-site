<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Üstün Deneme Kampüsü</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/png" href="favicon.png" />
<style>
html, body { margin:0; padding:0; overflow:hidden; width:100%; height:100%; background:#0f172a;}
#renderCanvas { width:100%; height:100%; touch-action:none; }
</style>
</head>

<body>
<canvas id="renderCanvas"></canvas>

<audio id="steps" src="https://raw.githubusercontent.com/myu0509/ebediyol-site/main/sounds/steps.mp3" preload="auto"></audio>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true);
const scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color3(0.06,0.08,0.15);

// Kamera
const camera = new BABYLON.UniversalCamera("cam",
  new BABYLON.Vector3(0,2,-12), scene);
camera.attachControl(canvas,true);
camera.speed = 0.5;

// Işık
const light = new BABYLON.HemisphericLight("l",
  new BABYLON.Vector3(0,1,0), scene);
light.intensity = 1.2;

// === ZEMİN (KAMPÜS) ===
const ground = BABYLON.MeshBuilder.CreateGround("g",
 {width:60,height:60}, scene);
const gmat = new BABYLON.StandardMaterial("gmat",scene);
gmat.diffuseColor = new BABYLON.Color3(0.18,0.25,0.18);
ground.material = gmat;

// === AVATAR (KALDI) ===
let avatar=null;
const steps=document.getElementById("steps");

BABYLON.SceneLoader.ImportMeshAsync(
 "", "",
 "https://raw.githubusercontent.com/myu0509/ebediyol-site/main/avatar.glb",
 scene
).then(r=>{
 avatar=r.meshes[0];
 avatar.position=new BABYLON.Vector3(0,0,-20);
 avatar.scaling=new BABYLON.Vector3(0.8,1.3,1);
});

// Hareket
let fwd=false, back=false;
window.addEventListener("keydown",e=>{
 if(e.key=="w"||e.key=="ArrowUp")fwd=true;
 if(e.key=="s"||e.key=="ArrowDown")back=true;
});
window.addEventListener("keyup",e=>{
 if(e.key=="w"||e.key=="ArrowUp")fwd=false;
 if(e.key=="s"||e.key=="ArrowDown")back=false;
});

// === 3 BİNA ===
function createBuilding(name,x,z,color){
 const b=BABYLON.MeshBuilder.CreateBox(name,
  {width:6,height:4,depth:6},scene);
 b.position.set(x,2,z);
 const m=new BABYLON.StandardMaterial(name+"m",scene);
 m.diffuseColor=color;
 b.material=m;

 // Yazı
 const labelPlane=BABYLON.MeshBuilder.CreatePlane(name+"p",
  {width:6,height:1.2},scene);
 labelPlane.position=new BABYLON.Vector3(x,4.6,z-3.2);

 const ui=BABYLON.GUI.AdvancedDynamicTexture.CreateForMesh(labelPlane);
 const txt=new BABYLON.GUI.TextBlock();
 txt.text=name;
 txt.color="white";
 txt.fontSize="120px";
 txt.outlineWidth=6;
 txt.outlineColor="black";
 ui.addControl(txt);

 // Tıklama
 b.actionManager=new BABYLON.ActionManager(scene);
 b.actionManager.registerAction(
  new BABYLON.ExecuteCodeAction(
   BABYLON.ActionManager.OnPickTrigger,
   ()=>alert(name+" yakında aktif olacak")
 ));
}

createBuilding("Sınav Merkezi",-10,0,new BABYLON.Color3(0.2,0.4,0.7));
createBuilding("Analiz Merkezi",0,0,new BABYLON.Color3(0.2,0.6,0.4));
createBuilding("Koçluk Merkezi",10,0,new BABYLON.Color3(0.6,0.4,0.2));

// === GİRİŞ TABELASI (KALDI) ===
const sign=BABYLON.MeshBuilder.CreatePlane("sign",{width:8,height:2},scene);
sign.position=new BABYLON.Vector3(0,4,-26);
const signUI=BABYLON.GUI.AdvancedDynamicTexture.CreateForMesh(sign);
const sText=new BABYLON.GUI.TextBlock();
sText.text="ÜSTÜN DENEME KAMPÜSÜ\n8. SINIF MATEMATİK";
sText.color="white";
sText.fontSize="90px";
sText.outlineWidth=6;
sText.outlineColor="black";
signUI.addControl(sText);

// === ÇİTLER (AYNEN KORUNDU – SADE) ===
const fenceMat=new BABYLON.StandardMaterial("f",scene);
fenceMat.diffuseColor=new BABYLON.Color3(0.2,0.15,0.1);

for(let i=-30;i<=30;i+=2){
 const p1=BABYLON.MeshBuilder.CreateBox("f1",{width:0.2,height:1,depth:0.2},scene);
 p1.position.set(i,0.5,30); p1.material=fenceMat;
 const p2=p1.clone("f2"); p2.position.z=-30;
 const p3=p1.clone("f3"); p3.position.set(30,0.5,i);
 const p4=p1.clone("f4"); p4.position.set(-30,0.5,i);
}

// === RENDER LOOP ===
scene.onBeforeRenderObservable.add(()=>{
 if(!avatar)return;

 if(fwd){
  avatar.position.z+=0.12;
  if(steps.paused){steps.currentTime=0;steps.play().catch(()=>{});}
 } else if(back){
  avatar.position.z-=0.12;
 } else {
  steps.pause();
 }

 camera.position.x=avatar.position.x;
 camera.position.z=avatar.position.z-6;
 camera.position.y=avatar.position.y+2;
});

engine.runRenderLoop(()=>scene.render());
window.addEventListener("resize",()=>engine.resize());
</script>
</body>
</html>
