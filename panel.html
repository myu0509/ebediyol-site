<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Analiz Paneli</title>
</head>
<body>

  <h1>Deneme Analiz Paneli</h1>
  <p>Buradan sınav seçilecek ve analiz yapılacak.</p>
<div id="panel-menu">
  <button onclick="showPanel('analiz')">Analiz Merkezi</button>
  <button onclick="showPanel('sinav')">Sınav Merkezi</button>
  <button onclick="showPanel('kocluk')">Koçluk Merkezi</button>
</div>

<hr>

<div id="paneller">
  <div id="analiz" class="panel">
    <h2>Analiz Merkezi</h2>
    <p>Deneme ve gelişim analiz raporu</p>
  </div>

  <div id="sinav" class="panel" style="display:none;">
    <h2>Sınav Merkezi</h2>
    <p>Deneme sınavları ve sonuçlar</p>
  </div>

  <div id="kocluk" class="panel" style="display:none;">
    <h2>Koçluk Merkezi</h2>
    <p>Bireysel rehberlik ve hedef takibi</p>
  </div>
</div>
  <script>
  function showPanel(panelId) {
    const panels = document.querySelectorAll('.panel');
    panels.forEach(p => p.style.display = 'none');
    document.getElementById(panelId).style.display = 'block';
  }
  </script>
</body>
</html>
