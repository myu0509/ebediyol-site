<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Üstün Deneme Analiz Merkezi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #0f172a; }
    #renderCanvas { width: 100%; height: 100%; touch-action: none; }

    /* Mobil kontrol butonları (seninki) */
    #mobileControls {
      position: fixed;
      bottom: 30px;
      right: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }
    .middleRow { display: flex; gap: 8px; }
    .ctrl {
      width: 55px;
      height: 55px;
      font-size: 24px;
      border-radius: 10px;
      border: none;
      background: rgba(255,255,255,0.35);
      color: black;
      font-weight: bold;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }
    .ctrl:active { background: rgba(255,255,255,0.6); }

    /* Basit üst bilgi (istersen kaldırırız) */
    #hint {
      position: fixed;
      top: 14px;
      left: 14px;
      background: rgba(0,0,0,0.45);
      color: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      font: 14px Arial, sans-serif;
      z-index: 12;
      max-width: 70vw;
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <!-- (İstersen kuş sesi de kalsın; kaldırmak istersen söylerim) -->
  <audio id="steps" src="https://raw.githubusercontent.com/myu0509/ebediyol-site/main/sounds/steps.mp3?raw=1" preload="auto"></audio>

  <div id="mobileControls">
    <button class="ctrl" id="btnUp">▲</button>
    <div class="middleRow">
      <button class="ctrl" id="btnLeft">◀</button>
      <button class="ctrl" id="btnRight">▶</button>
    </div>
    <button class="ctrl" id="btnDown">▼</button>
  </div>

  <!-- Babylon.js -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
    const scene  = new BABYLON.Scene(engine);
    scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
    scene.fogDensity = 0.01;
    scene.fogColor = new BABYLON.Color3(0.75, 0.85, 0.95);
    scene.collisionsEnabled = true;
    const examDate = new Date("2026-03-15T10:00:00").getTime();
    // Sesler
    const steps = document.getElementById("steps");

    scene.clearColor = new BABYLON.Color3(0.07, 0.10, 0.16);

    // Kamera (seninki)
    const camera = new BABYLON.UniversalCamera("camera", new BABYLON.Vector3(0, 2, -10), scene);
    camera.attachControl(canvas, true);
    camera.speed = 0.5;

    // Mobil hareket değişkenleri (seninki)
    let moveForward = false;
    let moveBackward = false;
    let moveLeft = false;
    let moveRight = false;
    let avatar = null;

    // Avatar yükle (seninki)
    const AVATAR_URL = "https://raw.githubusercontent.com/myu0509/ebediyol-site/main/avatar.glb";
    BABYLON.SceneLoader.ImportMeshAsync("", "", AVATAR_URL, scene).then((res) => {
      avatar = res.meshes[0] || res.meshes.find(m => m.name) || res.meshes.pop();
      avatar.ellipsoid = new BABYLON.Vector3(0.6, 1.2, 0.6);
      avatar.position = new BABYLON.Vector3(0, 0, -9);
      avatar.scaling  = new BABYLON.Vector3(0.8, 1.3, 1);
      avatar.rotation.y = camera.rotation.y + Math.PI;
      avatar.checkCollisions = true;

      // avatarın fiziksel çarpışma hacmi
      avatar.ellipsoid = new BABYLON.Vector3(0.6, 1.2, 0.6);
      avatar.ellipsoidOffset = new BABYLON.Vector3(0, 1.2, 0);
    });

    // Klavye kontrol (seninki)
    window.addEventListener("keydown", (e) => {
      if (e.key === "w" || e.key === "ArrowUp")    moveForward  = true;
      if (e.key === "s" || e.key === "ArrowDown")  moveBackward = true;
      if (e.key === "a" || e.key === "ArrowLeft")  moveLeft     = true;
      if (e.key === "d" || e.key === "ArrowRight") moveRight    = true;
    });
    window.addEventListener("keyup", (e) => {
      if (e.key === "w" || e.key === "ArrowUp")    moveForward  = false;
      if (e.key === "s" || e.key === "ArrowDown")  moveBackward = false;
      if (e.key === "a" || e.key === "ArrowLeft")  moveLeft     = false;
      if (e.key === "d" || e.key === "ArrowRight") moveRight    = false;
    });

    // Butonlara dokunma (seninki)
    const btnUp = document.getElementById("btnUp");
    const btnDown = document.getElementById("btnDown");
    const btnLeft = document.getElementById("btnLeft");
    const btnRight = document.getElementById("btnRight");

    btnUp.addEventListener("touchstart", () => moveForward = true);
    btnUp.addEventListener("touchend",   () => moveForward = false);
    btnDown.addEventListener("touchstart", () => moveBackward = true);
    btnDown.addEventListener("touchend",   () => moveBackward = false);
    btnLeft.addEventListener("touchstart", () => moveLeft = true);
    btnLeft.addEventListener("touchend",   () => moveLeft = false);
    btnRight.addEventListener("touchstart", () => moveRight = true);
    btnRight.addEventListener("touchend",   () => moveRight = false);

    // Işık
    const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
    light.intensity = 1.2;

    // === YENİ ZEMİN (iç mekân / sınıf tabanı) ===
const ground = BABYLON.MeshBuilder.CreateGround(
  "ground",
  { width: 25, height: 25 },
  scene
);

ground.checkCollisions = true;

const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
groundMat.diffuseColor = new BABYLON.Color3(0.82, 0.82, 0.80); // açık sınıf rengi
groundMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
ground.material = groundMat;

    // RENKLER
const wallColor = new BABYLON.Color3(1.0, 0.75, 0.2);   // turuncuya yakın sarı
const ceilingColor = new BABYLON.Color3(1.0, 0.9, 0.6); // açık sarı
// === SINIF DUVARLARI (BOX İLE - SORUNSUZ) ===
const ROOM_SIZE = 25;
const HALF = ROOM_SIZE / 2;
const WALL_HEIGHT = 6;
const WALL_THICKNESS = 0.5;

const wallMat = new BABYLON.StandardMaterial("wallMat", scene);
wallMat.diffuseColor = new BABYLON.Color3(1.0, 0.75, 0.2); // turuncuya yakın sarı

function createWall(name, w, h, d, x, y, z) {
  const wall = BABYLON.MeshBuilder.CreateBox(name, {
    width: w,
    height: h,
    depth: d
  }, scene);
  wall.position.set(x, y, z);
  wall.material = wallMat;
  wall.checkCollisions = true;
  return wall;
}

// ARKA
createWall("backWall",
  ROOM_SIZE, WALL_HEIGHT, WALL_THICKNESS,
  0, WALL_HEIGHT / 2, HALF
);

// ÖN
createWall("frontWall",
  ROOM_SIZE, WALL_HEIGHT, WALL_THICKNESS,
  0, WALL_HEIGHT / 2, -HALF
);

// SOL
createWall("leftWall",
  WALL_THICKNESS, WALL_HEIGHT, ROOM_SIZE,
  -HALF, WALL_HEIGHT / 2, 0
);

// SAĞ
createWall("rightWall",
  WALL_THICKNESS, WALL_HEIGHT, ROOM_SIZE,
  HALF, WALL_HEIGHT / 2, 0
);

// === SINIF SIRALARI ===
const deskMat = new BABYLON.StandardMaterial("deskMat", scene);
deskMat.diffuseColor = new BABYLON.Color3(0.55, 0.35, 0.2);

const DESK_WIDTH  = 1.9;
const DESK_HEIGHT = 0.8;
const DESK_DEPTH  = 1.0;

const ROWS = 4;     // önden arkaya
const COLS = 4;     // toplam sıra (2 sol + 2 sağ)

const GAP_Z = 3.5;  // ön-arka boşluk
const AISLE_WIDTH = 3.2; // ORTA KORİDOR

const startZ = -2;

// SOL ve SAĞ BLOKLARIN X POZİSYONLARI
const leftBaseX  = -AISLE_WIDTH / 2 - DESK_WIDTH;
const rightBaseX =  AISLE_WIDTH / 2 + DESK_WIDTH;

function createDesk(x, z) {
  const desk = BABYLON.MeshBuilder.CreateBox("desk", {
    width: DESK_WIDTH,
    height: DESK_HEIGHT,
    depth: DESK_DEPTH
  }, scene);

  desk.position = new BABYLON.Vector3(x, DESK_HEIGHT / 2, z - 4);
  desk.material = deskMat;
  desk.checkCollisions = true;

  return desk;
}

// === SIRALARI DİZ ===
for (let r = 0; r < ROWS; r++) {
  const z = startZ + r * GAP_Z;

  // SOL TARAF (2 SIRA)
  createDesk(leftBaseX - 1.4, z);
  createDesk(leftBaseX + 1.4, z);

  // SAĞ TARAF (2 SIRA)
  createDesk(rightBaseX - 1.4, z);
  createDesk(rightBaseX + 1.4, z);
}

// TAVAN
const ceiling = BABYLON.MeshBuilder.CreatePlane("ceiling", {
  width: ROOM_SIZE,
  height: ROOM_SIZE
}, scene);
ceiling.position = new BABYLON.Vector3(0, WALL_HEIGHT, 0);
ceiling.rotation.x = Math.PI / 2;
    const ceilingMat = new BABYLON.StandardMaterial("ceilingMat", scene);
ceilingMat.diffuseColor = new BABYLON.Color3(1.0, 0.9, 0.6);
ceiling.material = ceilingMat;
ceiling.checkCollisions = true;

    // === HAREKET + KAMERA/AVATAR HİZALAMA (seninki gibi) ===
    scene.onBeforeRenderObservable.add(() => {
      if (avatar) {
        // Kamera avatarı takip etsin (senin mantığın)
        camera.position.x = avatar.position.x - 4 * Math.sin(camera.rotation.y);
        camera.position.z = avatar.position.z - 4 * Math.cos(camera.rotation.y);
        camera.position.y = avatar.position.y + 1.8;

        // Avatar yönünü kameraya göre ayarla (sağa sola dönme)
        if (avatar.rotationQuaternion) avatar.rotationQuaternion = null;
        avatar.rotation.y = camera.rotation.y;
      }

      // adım sesi (seninki)
      if (avatar && steps) {
        const moving = (moveForward || moveBackward);
        if (moving) {
          if (steps.paused) {
            steps.currentTime = 0;
            steps.play().catch(()=>{});
          }
        } else {
          steps.pause();
        }
      }

      // Mobil hareket uygula (seninki)
      const moveSpeed = 0.11;

      const forward = new BABYLON.Vector3(
        Math.sin(camera.rotation.y),
        0,
        Math.cos(camera.rotation.y)
      );

      if (moveForward && avatar) {
        avatar.moveWithCollisions(forward.scale(moveSpeed));
      }

      if (moveBackward && avatar) {
        avatar.moveWithCollisions(forward.scale(-moveSpeed));
      }

      if (moveLeft)  camera.rotation.y -= 0.04;
      if (moveRight) camera.rotation.y += 0.04;

      // Sınır kontrolü (seninki)
      const LIMIT = 11;

if (avatar) {
  if (avatar.position.x >  LIMIT) avatar.position.x =  LIMIT;
  if (avatar.position.x < -LIMIT) avatar.position.x = -LIMIT;
  if (avatar.position.z >  LIMIT) avatar.position.z =  LIMIT;
  if (avatar.position.z < -LIMIT) avatar.position.z = -LIMIT;
}

      if (camera.position.x > 25) camera.position.x = 25;
      if (camera.position.x < -25) camera.position.x = -25;
      if (camera.position.z > 25) camera.position.z = 25;
      if (camera.position.z < -25) camera.position.z = -25;

      if (camera.position.y < 1.6) camera.position.y = 1.6;
      if (camera.position.y > 3.0) camera.position.y = 3.0;
     
    });

    // Render döngüsü
    engine.runRenderLoop(() => scene.render());
    window.addEventListener("resize", () => engine.resize());
  </script>
</body>
</html>
