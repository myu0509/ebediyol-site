<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Analiz Merkezi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Babylon -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    canvas {
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>

<body>
<canvas id="renderCanvas"></canvas>

<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true);

const createScene = async () => {
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color3(0.85, 0.9, 0.95);

  // IŞIK
  new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);

  // KAMERA (avatar takip)
  const camera = new BABYLON.FollowCamera(
    "followCam",
    new BABYLON.Vector3(0, 2, -6),
    scene
  );
  camera.radius = 6;
  camera.heightOffset = 2;
  camera.rotationOffset = 180;
  camera.attachControl(canvas, true);

  // ZEMİN
  const ground = BABYLON.MeshBuilder.CreateGround(
    "ground",
    { width: 20, height: 20 },
    scene
  );
  const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
  groundMat.diffuseColor = new BABYLON.Color3(0.9, 0.9, 0.85);
  ground.material = groundMat;

  // DUVARLAR (derslik)
  const wallMat = new BABYLON.StandardMaterial("wallMat", scene);
  wallMat.diffuseColor = new BABYLON.Color3(0.95, 0.95, 0.95);

  const backWall = BABYLON.MeshBuilder.CreateBox("backWall", {
    width: 20, height: 6, depth: 0.3
  }, scene);
  backWall.position.z = 10;
  backWall.position.y = 3;
  backWall.material = wallMat;

  const leftWall = backWall.clone("leftWall");
  leftWall.scaling = new BABYLON.Vector3(1,1,1);
  leftWall.rotation.y = Math.PI / 2;
  leftWall.position.x = -10;
  leftWall.position.z = 0;

  const rightWall = leftWall.clone("rightWall");
  rightWall.position.x = 10;

  // YAZI TAHTASI
  const board = BABYLON.MeshBuilder.CreatePlane(
    "board",
    { width: 8, height: 3 },
    scene
  );
  board.position = new BABYLON.Vector3(0, 3, 9.85);

  const boardMat = new BABYLON.StandardMaterial("boardMat", scene);
  boardMat.diffuseColor = new BABYLON.Color3(0.1, 0.4, 0.1);
  board.material = boardMat;

  // TAHTA YAZISI
  const boardUI = BABYLON.GUI.AdvancedDynamicTexture.CreateForMesh(board);
  const boardText = new BABYLON.GUI.TextBlock();
  boardText.text =
    "ANALİZ MENÜSÜ\n\n" +
    "▶ Deneme Sonuçları\n" +
    "▶ Gelişim Grafikleri\n" +
    "▶ Raporlar";
  boardText.color = "white";
  boardText.fontSize = 48;
  boardText.textHorizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
  boardText.paddingLeft = "40px";
  boardUI.addControl(boardText);

  // SIRALAR
  const deskMat = new BABYLON.StandardMaterial("deskMat", scene);
  deskMat.diffuseColor = new BABYLON.Color3(0.6, 0.4, 0.25);

  for (let i = -6; i <= 6; i += 3) {
    const leftDesk = BABYLON.MeshBuilder.CreateBox(
      "deskL",
      { width: 2, height: 1, depth: 1 },
      scene
    );
    leftDesk.position = new BABYLON.Vector3(-4, 0.5, i);
    leftDesk.material = deskMat;

    const rightDesk = leftDesk.clone("deskR");
    rightDesk.position.x = 4;
  }

  // AVATAR
  const result = await BABYLON.SceneLoader.ImportMeshAsync(
    "",
    "",
    "ebediyol-site/avatar.glb",
    scene
  );

  const avatar = result.meshes[0];
  avatar.scaling.scaleInPlace(1);
  avatar.position = new BABYLON.Vector3(0, 0, -6);
  camera.lockedTarget = avatar;

  // MOBİL JOYSTICK
  const ui = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("ui");
  const joystick = new BABYLON.GUI.VirtualJoystick(true);
  joystick.setJoystickColor("white");
  joystick.setPosition(120, -120);

  scene.onBeforeRenderObservable.add(() => {
    avatar.moveWithCollisions(
      new BABYLON.Vector3(
        joystick.deltaPosition.x * 0.03,
        0,
        joystick.deltaPosition.y * 0.03
      )
    );
  });

  return scene;
};

createScene().then(scene => {
  engine.runRenderLoop(() => scene.render());
});

window.addEventListener("resize", () => engine.resize());
</script>
</body>
</html>
