<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Analiz Merkezi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  width: 100%;
  height: 100%;
  background: #111;
}
#renderCanvas {
  width: 100%;
  height: 100%;
  touch-action: none;
}
#mobileControls {
  position: fixed;
  bottom: 30px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 10;
}
.middleRow { display: flex; gap: 8px; }
.ctrl {
  width: 55px;
  height: 55px;
  font-size: 24px;
  border-radius: 10px;
  border: none;
  background: rgba(255,255,255,0.4);
  font-weight: bold;
}
</style>
</head>

<body>
<canvas id="renderCanvas"></canvas>

<audio id="steps" src="https://raw.githubusercontent.com/myu0509/ebediyol-site/main/sounds/steps.mp3?raw=1"></audio>

<div id="mobileControls">
  <button class="ctrl" id="btnUp">▲</button>
  <div class="middleRow">
    <button class="ctrl" id="btnLeft">◀</button>
    <button class="ctrl" id="btnRight">▶</button>
  </div>
  <button class="ctrl" id="btnDown">▼</button>
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true);
const scene = new BABYLON.Scene(engine);
scene.collisionsEnabled = true;
scene.clearColor = new BABYLON.Color3(0.08,0.08,0.1);

const camera = new BABYLON.UniversalCamera(
  "camera",
  new BABYLON.Vector3(0,2,-6),
  scene
);
camera.attachControl(canvas,true);
camera.speed = 0.4;

const light = new BABYLON.HemisphericLight(
  "light",
  new BABYLON.Vector3(0,1,0),
  scene
);
light.intensity = 1.2;
// === ZEMİN ===
const floor = BABYLON.MeshBuilder.CreateGround(
  "floor",
  { width: 20, height: 20 },
  scene
);
floor.checkCollisions = true;

const floorMat = new BABYLON.StandardMaterial("floorMat", scene);
floorMat.diffuseColor = new BABYLON.Color3(0.75, 0.72, 0.68); // sınıf rengi
floor.material = floorMat;

let avatar = null;
let moveForward=false, moveBackward=false, moveLeft=false, moveRight=false;

BABYLON.SceneLoader.ImportMeshAsync(
  "",
  "",
  "https://raw.githubusercontent.com/myu0509/ebediyol-site/main/avatar.glb",
  scene
).then(res=>{
  avatar = res.meshes[0];
  avatar.position = new BABYLON.Vector3(0,0,0);
  avatar.scaling = new BABYLON.Vector3(0.8,1.3,1);
  avatar.checkCollisions = true;
  avatar.ellipsoid = new BABYLON.Vector3(0.6,1.2,0.6);
  avatar.ellipsoidOffset = new BABYLON.Vector3(0,1.2,0);
});

window.addEventListener("keydown",e=>{
  if(e.key==="w"||e.key==="ArrowUp") moveForward=true;
  if(e.key==="s"||e.key==="ArrowDown") moveBackward=true;
  if(e.key==="a"||e.key==="ArrowLeft") moveLeft=true;
  if(e.key==="d"||e.key==="ArrowRight") moveRight=true;
});
window.addEventListener("keyup",e=>{
  if(e.key==="w"||e.key==="ArrowUp") moveForward=false;
  if(e.key==="s"||e.key==="ArrowDown") moveBackward=false;
  if(e.key==="a"||e.key==="ArrowLeft") moveLeft=false;
  if(e.key==="d"||e.key==="ArrowRight") moveRight=false;
});

btnUp.ontouchstart=()=>moveForward=true;
btnUp.ontouchend=()=>moveForward=false;
btnDown.ontouchstart=()=>moveBackward=true;
btnDown.ontouchend=()=>moveBackward=false;
btnLeft.ontouchstart=()=>moveLeft=true;
btnLeft.ontouchend=()=>moveLeft=false;
btnRight.ontouchstart=()=>moveRight=true;
btnRight.ontouchend=()=>moveRight=false;

scene.onBeforeRenderObservable.add(()=>{
  if(!avatar) return;

  camera.position.x = avatar.position.x - 4*Math.sin(camera.rotation.y);
  camera.position.z = avatar.position.z - 4*Math.cos(camera.rotation.y);
  camera.position.y = avatar.position.y + 1.8;

  avatar.rotation.y = camera.rotation.y + Math.PI;

  const forward = new BABYLON.Vector3(
    Math.sin(camera.rotation.y),0,Math.cos(camera.rotation.y)
  );

  if(moveForward) avatar.moveWithCollisions(forward.scale(0.12));
  if(moveBackward) avatar.moveWithCollisions(forward.scale(-0.12));
  if(moveLeft) camera.rotation.y -= 0.04;
  if(moveRight) camera.rotation.y += 0.04;
});

engine.runRenderLoop(()=>scene.render());
window.addEventListener("resize",()=>engine.resize());
</script>
</body>
</html>
