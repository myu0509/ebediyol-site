<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Analiz Merkezi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html, body {
  margin: 0; padding: 0;
  width: 100%; height: 100%;
  overflow: hidden;
  background: #111827;
}
#renderCanvas {
  width: 100%;
  height: 100%;
  touch-action: none;
}

/* MOBİL KONTROLLER – AYNI */
#mobileControls {
  position: fixed;
  bottom: 30px;
  right: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  z-index: 10;
}
.middleRow { display: flex; gap: 8px; }
.ctrl {
  width: 55px;
  height: 55px;
  font-size: 24px;
  border-radius: 10px;
  border: none;
  background: rgba(255,255,255,0.35);
  color: black;
  font-weight: bold;
}
</style>
</head>

<body>
<canvas id="renderCanvas"></canvas>

<div id="mobileControls">
  <button class="ctrl" id="btnUp">▲</button>
  <div class="middleRow">
    <button class="ctrl" id="btnLeft">◀</button>
    <button class="ctrl" id="btnRight">▶</button>
  </div>
  <button class="ctrl" id="btnDown">▼</button>
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true);
const scene  = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color3(0.92, 0.92, 0.90);
scene.collisionsEnabled = true;

/* KAMERA – AYNI MANTIK */
const camera = new BABYLON.UniversalCamera(
  "camera",
  new BABYLON.Vector3(0, 2, -6),
  scene
);
camera.attachControl(canvas, true);
camera.speed = 0.5;

/* IŞIK */
new BABYLON.HemisphericLight(
  "light",
  new BABYLON.Vector3(0, 1, 0),
  scene
).intensity = 1.1;

/* === DERSLİK ORTAMI === */

// ZEMİN
const floor = BABYLON.MeshBuilder.CreateGround(
  "floor",
  { width: 20, height: 20 },
  scene
);
floor.checkCollisions = true;
const floorMat = new BABYLON.StandardMaterial("floorMat", scene);
floorMat.diffuseColor = new BABYLON.Color3(0.75, 0.72, 0.68);
floor.material = floorMat;

// DUVAR FONKSİYONU
function wall(w, h, x, y, z, ry) {
  const m = BABYLON.MeshBuilder.CreateBox(
    "wall",
    { width: w, height: h, depth: 0.4 },
    scene
  );
  m.position.set(x, y, z);
  m.rotation.y = ry;
  m.checkCollisions = true;
  const mat = new BABYLON.StandardMaterial("wmat", scene);
  mat.diffuseColor = new BABYLON.Color3(0.96, 0.96, 0.94);
  m.material = mat;
}

// 4 DUVAR
wall(20, 4, 0, 2, 10, 0);
wall(20, 4, 0, 2, -10, 0);
wall(20, 4, 10, 2, 0, Math.PI/2);
wall(20, 4, -10, 2, 0, Math.PI/2);

// TAVAN
const ceiling = BABYLON.MeshBuilder.CreateGround(
  "ceiling",
  { width: 20, height: 20 },
  scene
);
ceiling.position.y = 4;
ceiling.rotation.x = Math.PI;
ceiling.material = floorMat;

/* SIRALAR */
function desk(x, z) {
  const d = BABYLON.MeshBuilder.CreateBox(
    "desk",
    { width: 1.8, height: 0.7, depth: 1 },
    scene
  );
  d.position.set(x, 0.35, z);
  d.checkCollisions = true;
  const m = new BABYLON.StandardMaterial("dmat", scene);
  m.diffuseColor = new BABYLON.Color3(0.55, 0.35, 0.18);
  d.material = m;
}

for (let r = 0; r < 4; r++) {
  for (let c = -2; c <= 2; c++) {
    desk(c * 2.2, -2 - r * 2);
  }
}

/* YAZI TAHTASI */
const board = BABYLON.MeshBuilder.CreatePlane(
  "board",
  { width: 8, height: 3 },
  scene
);
board.position.set(0, 2.2, 9.6);
board.rotation.y = Math.PI;
board.checkCollisions = true;

const boardUI = BABYLON.GUI.AdvancedDynamicTexture.CreateForMesh(
  board, 1024, 512
);

const boardBG = new BABYLON.GUI.Rectangle();
boardBG.background = "#1f2933";
boardBG.thickness = 0;
boardUI.addControl(boardBG);

const boardText = new BABYLON.GUI.TextBlock();
boardText.text = "ANALİZ MENÜSÜ\n\n• Deneme Sonuçları\n• Gelişim Grafikleri\n• PDF Raporlar";
boardText.color = "white";
boardText.fontSize = "60px";
boardText.textHorizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_CENTER;
boardText.textVerticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_CENTER;
boardBG.addControl(boardText);

/* === AVATAR – AYNI DOSYA / AYNI AYAR === */
let avatar = null;
const AVATAR_URL =
"https://raw.githubusercontent.com/myu0509/ebediyol-site/main/avatar.glb";

BABYLON.SceneLoader.ImportMeshAsync("", "", AVATAR_URL, scene)
.then(res => {
  avatar = res.meshes[0];
  avatar.position = new BABYLON.Vector3(0, 0, -6);
  avatar.scaling = new BABYLON.Vector3(0.8, 1.3, 1);
  avatar.checkCollisions = true;
  avatar.ellipsoid = new BABYLON.Vector3(0.6, 1.2, 0.6);
  avatar.ellipsoidOffset = new BABYLON.Vector3(0, 1.2, 0);
});

/* HAREKET – AYNI */
let moveForward=false, moveBackward=false, moveLeft=false, moveRight=false;

window.addEventListener("keydown", e=>{
  if(e.key==="w"||e.key==="ArrowUp") moveForward=true;
  if(e.key==="s"||e.key==="ArrowDown") moveBackward=true;
  if(e.key==="a"||e.key==="ArrowLeft") moveLeft=true;
  if(e.key==="d"||e.key==="ArrowRight") moveRight=true;
});
window.addEventListener("keyup", e=>{
  if(e.key==="w"||e.key==="ArrowUp") moveForward=false;
  if(e.key==="s"||e.key==="ArrowDown") moveBackward=false;
  if(e.key==="a"||e.key==="ArrowLeft") moveLeft=false;
  if(e.key==="d"||e.key==="ArrowRight") moveRight=false;
});

btnUp.ontouchstart=()=>moveForward=true;
btnUp.ontouchend=()=>moveForward=false;
btnDown.ontouchstart=()=>moveBackward=true;
btnDown.ontouchend=()=>moveBackward=false;
btnLeft.ontouchstart=()=>moveLeft=true;
btnLeft.ontouchend=()=>moveLeft=false;
btnRight.ontouchstart=()=>moveRight=true;
btnRight.ontouchend=()=>moveRight=false;

/* LOOP */
scene.onBeforeRenderObservable.add(()=>{
  if(!avatar) return;

  camera.position.x = avatar.position.x - 4*Math.sin(camera.rotation.y);
  camera.position.z = avatar.position.z - 4*Math.cos(camera.rotation.y);
  camera.position.y = avatar.position.y + 1.8;

  avatar.rotation.y = camera.rotation.y;

  const speed = 0.12;
  const dir = new BABYLON.Vector3(
    Math.sin(camera.rotation.y),0,Math.cos(camera.rotation.y)
  );

  if(moveForward) avatar.moveWithCollisions(dir.scale(speed));
  if(moveBackward) avatar.moveWithCollisions(dir.scale(-speed));
  if(moveLeft) camera.rotation.y -= 0.04;
  if(moveRight) camera.rotation.y += 0.04;
});

engine.runRenderLoop(()=>scene.render());
window.addEventListener("resize",()=>engine.resize());
</script>
</body>
</html>
