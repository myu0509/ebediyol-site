<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Analiz Merkezi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- BABYLON -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #1e1e1e;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>

<body>
<canvas id="renderCanvas"></canvas>

<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true);

// AVATAR (ZİYARET.HTML İLE AYNI)
const AVATAR_URL =
  "https://raw.githubusercontent.com/myu0509/ebediyol-site/main/avatar.glb";

const createScene = async () => {
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.9, 0.9, 0.9, 1);

  /* IŞIK */
  new BABYLON.HemisphericLight(
    "light",
    new BABYLON.Vector3(0, 1, 0),
    scene
  );

  /* ZEMİN – AHŞAP */
  const floor = BABYLON.MeshBuilder.CreateGround(
    "floor",
    { width: 30, height: 20 },
    scene
  );
  const floorMat = new BABYLON.StandardMaterial("floorMat", scene);
  floorMat.diffuseColor = new BABYLON.Color3(0.55, 0.4, 0.25);
  floor.material = floorMat;

  /* TAHTA */
  const board = BABYLON.MeshBuilder.CreatePlane(
    "board",
    { width: 10, height: 4 },
    scene
  );
  board.position = new BABYLON.Vector3(0, 3, 9.9);
  board.rotation.y = Math.PI;

  const boardMat = new BABYLON.StandardMaterial("boardMat", scene);
  boardMat.diffuseColor = new BABYLON.Color3(0.1, 0.4, 0.1);
  board.material = boardMat;

  /* SIRALAR */
  const deskMat = new BABYLON.StandardMaterial("deskMat", scene);
  deskMat.diffuseColor = new BABYLON.Color3(0.45, 0.3, 0.15);

  for (let i = 0; i < 4; i++) {
    const leftDesk = BABYLON.MeshBuilder.CreateBox(
      "deskL" + i,
      { width: 1.2, height: 0.6, depth: 2 },
      scene
    );
    leftDesk.position = new BABYLON.Vector3(-5, 0.3, -4 + i * 3);
    leftDesk.material = deskMat;

    const rightDesk = leftDesk.clone("deskR" + i);
    rightDesk.position.x = 5;
  }

  /* KAMERA */
  const camera = new BABYLON.FollowCamera(
    "followCam",
    new BABYLON.Vector3(0, 3, -6),
    scene
  );
  camera.radius = 6;
  camera.heightOffset = 2;
  camera.rotationOffset = 180;
  camera.cameraAcceleration = 0.05;
  camera.maxCameraSpeed = 10;
  camera.attachControl(canvas, true);

  /* AVATAR YÜKLE */
  const result = await BABYLON.SceneLoader.ImportMeshAsync(
    "",
    "",
    AVATAR_URL,
    scene
  );

  const avatar = result.meshes[0];
  avatar.scaling = new BABYLON.Vector3(1.2, 1.2, 1.2);
  avatar.position = new BABYLON.Vector3(0, 0, -6);

  camera.lockedTarget = avatar;

  /* KONTROLLER */
  const inputMap = {};
  scene.actionManager = new BABYLON.ActionManager(scene);

  scene.actionManager.registerAction(
    new BABYLON.ExecuteCodeAction(
      BABYLON.ActionManager.OnKeyDownTrigger,
      evt => inputMap[evt.sourceEvent.key] = true
    )
  );

  scene.actionManager.registerAction(
    new BABYLON.ExecuteCodeAction(
      BABYLON.ActionManager.OnKeyUpTrigger,
      evt => inputMap[evt.sourceEvent.key] = false
    )
  );

  scene.onBeforeRenderObservable.add(() => {
    if (inputMap["w"]) avatar.position.z += 0.1;
    if (inputMap["s"]) avatar.position.z -= 0.1;
    if (inputMap["a"]) avatar.position.x -= 0.1;
    if (inputMap["d"]) avatar.position.x += 0.1;
  });

  return scene;
};

createScene().then(scene => {
  engine.runRenderLoop(() => scene.render());
});

window.addEventListener("resize", () => engine.resize());
</script>
</body>
</html>
